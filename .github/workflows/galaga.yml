name: Generate Galaga Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Galaga (Dark Theme)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Sneltro
          game: galaga
          theme: dark

      - name: Stage Dark Theme Asset
        run: |
          mkdir -p dist-staged
          cp dist/galaga.svg dist-staged/galaga-dark.svg

      - name: Generate Galaga (Light Theme)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Sneltro
          game: galaga
          theme: light

      - name: Prepare Final Output Assets
        run: |
          cp dist/galaga.svg dist-staged/galaga-light.svg
          rm -rf dist
          mv dist-staged dist

      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
